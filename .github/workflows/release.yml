# Publishes iptranslator-client to PyPI when a version tag is pushed.
# Tag with the version from src/iptranslator_client/_version.py:
#   git tag v2.1.0 && git push origin v2.1.0
#
# Auth is PyPI Trusted Publishing (OIDC) — no API token is stored. The publisher
# on pypi.org must name repository owner `ipappify`, repository
# `ipt-client-python`, workflow file `release.yml` and environment `pypi`,
# matching the job below.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token for the PyPI trusted-publisher exchange
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m build
      # Guards against tagging v2.2.0 while _version.py still says 2.1.0:
      # without this the job would upload the stale version (or fail late).
      - name: Verify package version matches tag
        run: |
          expected="dist/iptranslator_client-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME expects $expected, but build produced:"
            ls -1 dist
            echo "Bump __version__ in src/iptranslator_client/_version.py to match the tag."
            exit 1
          fi
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
